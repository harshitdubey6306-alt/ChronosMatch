services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: chronos
      POSTGRES_PASSWORD: chronos
      POSTGRES_DB: chronosmatch
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronos"]
      interval: 3s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://chronos:chronos@db:5432/chronosmatch
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]
volumes:
  pgdata:
