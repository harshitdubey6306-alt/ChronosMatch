<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChronosMatch Institutional Terminal</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #111111;
            --border-color: #222222;
            --text-main: #f3f4f6;
            --text-muted: #6b7280;
            --accent-green: #00ff88;
            --accent-red: #ff3366;
            --accent-blue: #00e5ff;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            padding: 15px; 
            margin: 0;
        }

        .container { max-width: 1200px; margin: 0 auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;}
        .header h2 { margin: 0; font-weight: 700; letter-spacing: -0.5px; }
        .header h2 span { color: var(--accent-blue); }
        
        .status { padding: 6px 12px; border-radius: 4px; font-weight: 600; font-size: 0.85em; display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace;}
        .status::before { content: ''; width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .connected { background-color: rgba(0, 255, 136, 0.1); color: var(--accent-green); border: 1px solid rgba(0, 255, 136, 0.2); }
        .connected::before { background-color: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }
        .disconnected { background-color: rgba(255, 51, 102, 0.1); color: var(--accent-red); border: 1px solid rgba(255, 51, 102, 0.2); }
        .disconnected::before { background-color: var(--accent-red); }

        .toolbar { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .controls { display: flex; gap: 10px; }
        button { 
            background: #1a1a1a; color: var(--text-main); border: 1px solid #333; 
            padding: 8px 16px; border-radius: 4px; font-size: 0.85em; font-weight: 600;
            cursor: pointer; transition: all 0.2s; 
        }
        button:hover { background: #2a2a2a; border-color: #444; }
        button.active-pause { background: rgba(255, 51, 102, 0.15); color: var(--accent-red); border-color: var(--accent-red); }

        /* Trader Metrics Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--card-bg); padding: 15px; border-radius: 6px; border: 1px solid var(--border-color); }
        .stat-card h3 { margin: 0 0 5px 0; color: var(--text-muted); font-size: 0.75em; text-transform: uppercase; letter-spacing: 1px; }
        .stat-card .value { font-family: 'JetBrains Mono', monospace; font-size: 1.6em; font-weight: 700; }
        
        .flash-green { animation: flashG 0.5s ease-out; color: var(--accent-green) !important; }
        .flash-red { animation: flashR 0.5s ease-out; color: var(--accent-red) !important; }
        
        @keyframes flashG { 0% { background-color: rgba(0,255,136,0.3); } 100% { background-color: transparent; } }
        @keyframes flashR { 0% { background-color: rgba(255,51,102,0.3); } 100% { background-color: transparent; } }

        .dashboard-body { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        
        .chart-container { background: var(--card-bg); padding: 15px; border-radius: 6px; border: 1px solid var(--border-color); height: 400px; }
        
        /* Order Tape (Table) */
        .tape-container { background: var(--card-bg); border-radius: 6px; border: 1px solid var(--border-color); height: 400px; overflow: hidden; display: flex; flex-direction: column; }
        .tape-header { padding: 12px 15px; background: #0a0a0a; border-bottom: 1px solid var(--border-color); }
        .tape-header h3 { margin: 0; font-size: 0.85em; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }
        
        table { width: 100%; border-collapse: collapse; font-family: 'JetBrains Mono', monospace; font-size: 0.85em; }
        th, td { padding: 10px 15px; text-align: right; }
        th:first-child, td:first-child { text-align: left; }
        th { background-color: #111; color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.8em; border-bottom: 1px solid var(--border-color); }
        tr { border-bottom: 1px solid #1a1a1a; }
        tr:hover { background-color: #1a1a1a; }
        
        .badge { padding: 2px 6px; border-radius: 3px; font-size: 0.8em; font-weight: 700; }
        .badge-buy { background: rgba(0, 255, 136, 0.15); color: var(--accent-green); }
        .badge-sell { background: rgba(255, 51, 102, 0.15); color: var(--accent-red); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Chronos<span>Match</span> HFT Engine</h2>
            <div id="status" class="status disconnected">Awaiting Engine Connection...</div>
        </div>

        <div class="toolbar">
            <div class="controls">
                <button id="btn-pause">⏸ Pause</button>
                <button id="btn-clear">🗑 Reset Analytics</button>
            </div>
            <div style="font-family: 'JetBrains Mono'; font-size: 0.9em; color: var(--text-muted); align-self: center;">
                Zero-Copy mmap IPC Active
            </div>
        </div>
        
        <!-- Live Analytics Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Latest Price</h3>
                <div id="stat-price" class="value">0.00</div>
            </div>
            <div class="stat-card">
                <h3>Session VWAP</h3>
                <div id="stat-vwap" class="value" style="color: var(--accent-blue);">0.00</div>
            </div>
            <div class="stat-card">
                <h3>Session High</h3>
                <div id="stat-high" class="value" style="color: var(--accent-green);">0.00</div>
            </div>
            <div class="stat-card">
                <h3>Session Low</h3>
                <div id="stat-low" class="value" style="color: var(--accent-red);">0.00</div>
            </div>
            <div class="stat-card">
                <h3>Total Volume</h3>
                <div id="stat-vol" class="value">0</div>
            </div>
            <div class="stat-card">
                <h3>Engine TPS</h3>
                <div id="stat-tps" class="value" style="color: #f59e0b;">0</div>
            </div>
        </div>

        <div class="dashboard-body">
            <!-- Price Chart -->
            <div class="chart-container">
                <canvas id="priceChart"></canvas>
            </div>

            <!-- Real-time Trade Tape -->
            <div class="tape-container">
                <div class="tape-header">
                    <h3>Live Order Tape</h3>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Side</th>
                            <th>Size</th>
                            <th>Price</th>
                        </tr>
                    </thead>
                    <tbody id="trade-history"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // --- Trader Analytics State ---
        let isPaused = false;
        let prevPrice = null;
        let sessionHigh = -Infinity;
        let sessionLow = Infinity;
        let cumVolume = 0;
        let cumPriceVolume = 0;
        
        // TPS (Trades Per Second) Monitor
        let tradesThisSecond = 0;
        setInterval(() => {
            document.getElementById('stat-tps').textContent = tradesThisSecond.toLocaleString();
            tradesThisSecond = 0;
        }, 1000);

        // --- Chart Configuration ---
        const ctx = document.getElementById('priceChart').getContext('2d');
        const priceChart = new Chart(ctx, {
            type: 'line',
            data: { labels: [], datasets: [{ 
                label: 'Execution Price', data: [], 
                borderColor: '#00e5ff', backgroundColor: 'rgba(0, 229, 255, 0.05)', 
                borderWidth: 2, pointRadius: 0, tension: 0.1, fill: true,
                stepped: true // Gives it that algorithmic "tick" look
            }]},
            options: {
                responsive: true, maintainAspectRatio: false, animation: false,
                scales: { 
                    x: { display: false }, 
                    y: { position: 'right', grid: { color: '#222' }, ticks: { color: '#6b7280', font: { family: 'JetBrains Mono' } } } 
                },
                plugins: { legend: { display: false } }
            }
        });

        // --- Button Controls ---
        document.getElementById('btn-pause').addEventListener('click', (e) => {
            isPaused = !isPaused;
            e.target.innerHTML = isPaused ? "▶ Resume" : "⏸ Pause";
            e.target.classList.toggle('active-pause');
        });

        document.getElementById('btn-clear').addEventListener('click', () => {
            priceChart.data.labels = []; priceChart.data.datasets[0].data = []; priceChart.update();
            document.getElementById("trade-history").innerHTML = '';
            sessionHigh = -Infinity; sessionLow = Infinity; cumVolume = 0; cumPriceVolume = 0;
            ['stat-price', 'stat-vwap', 'stat-high', 'stat-low', 'stat-vol'].forEach(id => document.getElementById(id).textContent = "0.00");
            prevPrice = null;
        });

        // --- WebSocket & Core Logic ---
        const ws = new WebSocket("ws://127.0.0.1:8000/ws");
        const statusDiv = document.getElementById("status");
        const tbody = document.getElementById("trade-history");

        ws.onopen = () => { statusDiv.textContent = "Engine Connected: LIVE"; statusDiv.className = "status connected"; };
        ws.onclose = () => { statusDiv.textContent = "Engine Disconnected"; statusDiv.className = "status disconnected"; };

        ws.onmessage = (event) => {
            if (isPaused) return;

            const trade = JSON.parse(event.data);
            tradesThisSecond++;

            // 1. Tick Direction (Buy = Uptick, Sell = Downtick)
            const isUptick = prevPrice === null || trade.price >= prevPrice;
            const sideClass = isUptick ? 'badge-buy' : 'badge-sell';
            const sideText = isUptick ? 'BUY' : 'SELL';
            const priceColorClass = isUptick ? 'flash-green' : 'flash-red';
            prevPrice = trade.price;

            // 2. Advanced Analytics
            if (trade.price > sessionHigh) sessionHigh = trade.price;
            if (trade.price < sessionLow) sessionLow = trade.price;
            
            cumVolume += trade.qty;
            cumPriceVolume += (trade.price * trade.qty);
            const vwap = cumPriceVolume / cumVolume;

            // 3. Update DOM Stats
            const priceEl = document.getElementById("stat-price");
            priceEl.textContent = trade.price.toFixed(2);
            
            // Trigger CSS flash animation
            priceEl.className = `value ${priceColorClass}`;
            setTimeout(() => priceEl.className = "value", 500);

            document.getElementById("stat-vwap").textContent = vwap.toFixed(2);
            document.getElementById("stat-high").textContent = sessionHigh.toFixed(2);
            document.getElementById("stat-low").textContent = sessionLow.toFixed(2);
            document.getElementById("stat-vol").textContent = cumVolume.toLocaleString();

            // 4. Update Chart
            priceChart.data.labels.push(trade.order_id);
            priceChart.data.datasets[0].data.push(trade.price);
            if (priceChart.data.labels.length > 60) {
                priceChart.data.labels.shift();
                priceChart.data.datasets[0].data.shift();
            }
            priceChart.update();

            // 5. Update Order Tape (Table)
            const timeStr = new Date().toLocaleTimeString('en-US', { hour12: false, hour: 'numeric', minute: 'numeric', second: 'numeric', fractionalSecondDigits: 2 });
            const row = document.createElement("tr");
            row.innerHTML = `
                <td style="color: var(--text-muted); text-align: left;">${timeStr}</td>
                <td style="text-align: left;"><span class="badge ${sideClass}">${sideText}</span></td>
                <td>${trade.qty}</td>
                <td style="color: ${isUptick ? 'var(--accent-green)' : 'var(--accent-red)'}; font-weight: 700;">$${trade.price.toFixed(2)}</td>
            `;
            tbody.insertBefore(row, tbody.firstChild);

            if (tbody.children.length > 20) {
                tbody.removeChild(tbody.lastChild);
            }
        };
    </script>
</body>
</html>
